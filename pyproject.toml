[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credential-mask-jev"
version = "0.1.0"
description = "Local-first reversible masking with review-gated export"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
credential-mask = "credential_mask.cli:main"

[tool.setuptools.packages.find]
include = ["credential_mask*"]
