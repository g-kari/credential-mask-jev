name: web-synthetic-tests
on:
  push:
    branches: [main]
    paths: ['web/**', 'wrangler.jsonc', '.github/workflows/web-test.yml']
  pull_request:
    paths: ['web/**', 'wrangler.jsonc', '.github/workflows/web-test.yml']
permissions:
  contents: read
concurrency:
  group: web-synthetic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - run: node --test web/*.test.mjs
      - run: node web/build-static.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: command -v google-chrome && google-chrome --version
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: fc-match :lang=ja
      - run: node browser-check.mjs
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: success()
        with:
          name: mask-ui-synthetic-screenshots
          path: web/visual-evidence/*.png
          if-no-files-found: error
          retention-days: 7
