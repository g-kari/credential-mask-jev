name: web-synthetic-tests
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-test.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-test.yml']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/*.test.mjs
