name: web-synthetic-tests
on:
  push:
    branches: [main]
    paths: ['web/**', 'wrangler.jsonc', '.github/workflows/web-test.yml']
  pull_request:
    paths: ['web/**', 'wrangler.jsonc', '.github/workflows/web-test.yml']
permissions:
  contents: read
concurrency:
  group: web-synthetic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test web/*.test.mjs
      - run: node web/build-static.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: command -v google-chrome && google-chrome --version
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: fc-match :lang=ja
      - run: node browser-check.mjs
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: mask-ui-synthetic-screenshots
          path: web/visual-evidence/*.png
          if-no-files-found: error
          retention-days: 7
