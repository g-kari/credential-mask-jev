name: web-synthetic-tests
on:
  push:
    branches: [main]
    paths: ['web/**', 'wrangler.jsonc', '.github/workflows/web-test.yml']
  pull_request:
    paths: ['web/**', 'wrangler.jsonc', '.github/workflows/web-test.yml']
permissions:
  contents: read
concurrency:
  group: web-synthetic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test web/*.test.mjs
      - run: node web/build-static.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: command -v google-chrome && google-chrome --version
      - run: node browser-check.mjs
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mask-ui-synthetic-screenshots
          path: web/visual-evidence/*.png
          if-no-files-found: error
          retention-days: 7
